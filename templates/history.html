<!DOCTYPE html>
<html>
<head>
    <title>Employee History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container mt-5">

    <h2>History for Employee {{ employee_id }}</h2>

    <table class="table table-bordered">

        <thead>
            <tr>
                <th>Event</th>
                <th>Old Value</th>
                <th>New Value</th>
                <th>Action By</th>
                <th>Created At</th>
                <th>Version</th>
                
            </tr>
        </thead>

        <tbody>

        {% for log in logs %}

        <tr>
            <td>{{ log.event_type }}</td>
            <td>{{ log.old_value }}</td>
            <td>{{ log.new_value }}</td>
            <td>{{ log.action_by }}</td>
            <td>{{ log.created_at }}</td>
            <td>{{ log.version }}</td>
        </tr>

        {% endfor %}

        </tbody>

    </table>

</body>
</html>
